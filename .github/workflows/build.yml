name: inochi2d-android

on:
  workflow_dispatch:

env:
  LDC_VERSION: "1.42.0"
  NDK_VERSION: "r27c"
  TARGET_TRIPLE: "armv7a-linux-androideabi29"
  LDC_ANDROID_ADDON: "android-armv7a"

jobs:
  build-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Inochi2D/inochi2d
          path: inochi2d

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-${{ env.LDC_VERSION }}

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Drop Android runtime libs into the LDC install
        run: |
          set -e
          LDC_ROOT="$(dirname "$(dirname "$DC")")"
          curl -fL -o addon.tar.xz \
            "https://github.com/ldc-developers/ldc/releases/download/v${LDC_VERSION}/ldc2-${LDC_VERSION}-${LDC_ANDROID_ADDON}.tar.xz"
          tar -xJf addon.tar.xz -C "$LDC_ROOT"

      - run: echo "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build libinochi2d.so
        working-directory: inochi2d
        run: dub build --compiler=ldc2 --config=dynamic --build=release --arch=${TARGET_TRIPLE}

      - uses: actions/upload-artifact@v4
        with:
          name: inochi2d-so
          path: |
            inochi2d/out/libinochi2d.so
            inochi2d/out/include/**

  build-apk:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # checks out THIS repo (the Android project above)

      - uses: actions/download-artifact@v4
        with:
          name: inochi2d-so
          path: downloaded

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Place the D library + header, compile the native glue
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/armeabi-v7a app/src/main/cpp/include
          cp downloaded/libinochi2d.so app/src/main/jniLibs/armeabi-v7a/
          cp -r downloaded/include/. app/src/main/cpp/include/ 2>/dev/null || true

          CC_BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET_TRIPLE}-clang"
          GLUE_DIR="${{ steps.ndk.outputs.ndk-path }}/sources/android/native_app_glue"

          "$CC_BIN" -O2 -fPIC -shared \
            -I "$GLUE_DIR" -I app/src/main/cpp/include \
            app/src/main/cpp/main.c "$GLUE_DIR/android_native_app_glue.c" \
            -L app/src/main/jniLibs/armeabi-v7a -linochi2d \
            -landroid -lEGL -lGLESv2 -llog \
            -o app/src/main/jniLibs/armeabi-v7a/libmain.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: inochi2d-demo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
